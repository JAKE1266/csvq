name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: 构建发行包
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装构建工具
        run: python -m pip install build twine
      - name: 构建 wheel 与 sdist
        run: python -m build
      - name: 检查发行包元数据
        run: python -c "import glob, subprocess, sys; subprocess.check_call([sys.executable, '-m', 'twine', 'check', *glob.glob('dist/*')])"
      - uses: actions/upload-artifact@v4
        with:
          name: csvq-dist
          path: dist/*
          if-no-files-found: error

  test:
    name: 已安装 wheel(${{ matrix.os }}, Python ${{ matrix.python }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-15-intel]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: 下载发行包
        uses: actions/download-artifact@v4
        with:
          name: csvq-dist
          path: dist
      - name: 在仓库外安装真实 wheel
        working-directory: ${{ runner.temp }}
        run: python -c "import os, pathlib, subprocess, sys; wheels=list((pathlib.Path(os.environ['GITHUB_WORKSPACE'])/'dist').glob('csvq-*.whl')); assert len(wheels)==1, wheels; subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--no-deps', str(wheels[0])])"
      - name: 检查依赖一致性
        run: python -m pip check
      - name: 已安装 wheel 冒烟
        run: python tests/smoke_installed.py
      - name: 运行单元测试
        run: python -m unittest discover -s tests -v
